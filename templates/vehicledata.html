<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vehicle Insurance Predictor</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/style.css">

    <!-- Background Canvas Style -->
    <style>
        canvas#background {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Animated Background -->
    <canvas id="background"></canvas>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg p-4 w-100" style="max-width: 700px;">
            <h2 class="text-center mb-4 text-primary">Vehicle Insurance Prediction</h2>

            {% if context != "Rendering" %}
                <div class="alert alert-info text-center fw-bold">
                    Prediction: <span class="text-dark">{{ context }}</span>
                </div>
            {% endif %}

            <form method="post" action="/">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Gender</label>
                        <select name="Gender" class="form-select" required>
                            <option value="0">Female</option>
                            <option value="1">Male</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Age</label>
                        <input type="number" name="Age" class="form-control" min="18" required>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Driving License</label>
                        <select name="Driving_License" class="form-select" required>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Region Code</label>
                        <input type="number" step="0.01" name="Region_Code" class="form-control" required>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Previously Insured</label>
                        <select name="Previously_Insured" class="form-select" required>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Annual Premium</label>
                        <input type="number" step="0.01" name="Annual_Premium" class="form-control" required>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Policy Sales Channel</label>
                        <input type="number" step="0.01" name="Policy_Sales_Channel" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Vintage</label>
                        <input type="number" name="Vintage" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Vehicle Age</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="Vehicle_Age" value="lt_1" id="lt1" required>
                        <label class="form-check-label" for="lt1">Less than 1 Year</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="Vehicle_Age" value="gt_2" id="gt2">
                        <label class="form-check-label" for="gt2">More than 2 Years</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="Vehicle_Age" value="btw_1_2" id="btw">
                        <label class="form-check-label" for="btw">Between 1 and 2 Years</label>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Vehicle Damage</label>
                    <select name="Vehicle_Damage_Yes" class="form-select" required>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold">Predict</button>
            </form>
        </div>
    </div>

    <!-- Particle Background Script -->
    <script>
        const canvas = document.getElementById("background");
        const ctx = canvas.getContext("2d");
        let particlesArray;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }

            draw() {
                ctx.fillStyle = "rgba(13, 110, 253, 0.7)";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < 100; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
